        class Car
        {
            constructor(model, year)
            {
              this.year = year;
              this.model = model;
            }
            getYear()
            {
                return year;
            }
            getModel()
            {
                return model;
            }
            showInfo()
            {
                console.log(this.model + " " + this.year);
            }
        }
        let c1 = new Car("Mitsubisi", 2007);
        console.log("c1 year: " + c1.getYear());
        console.log("c1 model: " + c1.getModel());
